{% load static %}
<article>
    <div class="bg-white border mt-2">
        <div>
        <!-- Encabezado de la publicación con imagen y nombre del usuario -->
        <div class="d-flex flex-row justify-content-between align-items-center p-2 border-bottom">
            <div class="d-flex flex-row align-items-center feed-text px-2">
            {% if post.user.profile.profile_picture.name %}
                <img class="rounded-circle"
                    src="{{ post.user.profile.profile_picture.url }}"
                    width="45" height="45">
            {% else %}
                <img class="rounded-circle"
                    src="{% static 'icons/mi_perfil.png' %}"
                    width="45" height="45">
            {% endif %}

            <div class="d-flex flex-column flex-wrap ml-2">
                <span class="font-weight-bold">{{ post.user.username }}</span>
                <span class="text-black-50 time">{{ post.created_at }}</span>
            </div>
            </div>
            <div class="feed-icon px-2">
            <i class="fa fa-ellipsis-v text-black-50"></i>
            </div>
        </div>
        </div>

        <!-- Imagen de la publicación -->
        <div class="feed-image p-2 px-3">
        <img class="img-fluid img-responsive" src="{{ post.image.url }}">
        </div>

        <!-- Íconos de acción -->
        <div class="d-flex justify-content-end socials p-2 py-3">
        <i class="fa fa-thumbs-up"></i>
        <i class="fa fa-comments-o"></i>
        <i class="fa fa-share"></i>
        </div>

        <!-- Pie de la publicación con botón de me gusta y contador -->
        <footer>
        <p class="text-center mt-2 mb-2">
            <a class="btn btn-primary btn-sm" href="{% url 'post_detail' post.pk %}">Ver Post</a>
        </p>
        </footer>
    </div>
</article>
